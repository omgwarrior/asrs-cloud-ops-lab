apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-ops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-ops-demo
  template:
    metadata:
      labels:
        app: cloud-ops-demo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: cloud-ops-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-ops-demo
spec:
  selector: {app: cloud-ops-demo}
  ports:
    - port: 80
      targetPort: 8080
